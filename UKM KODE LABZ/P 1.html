   <h1><!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Contoh Penggunaan Class</title>
    <style>
        /* Mengatur gaya untuk semua elemen yang memiliki class .kartu */
        .kartu {
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
        }

        /* Mengatur gaya khusus untuk teks yang memiliki class .penting */
        .penting {
            color: red;
            font-weight: Bold ;
            font-family: 'Algerian', sans-serif;
        }
    </style>
</head>
<body>

    <div class="kartu">
        <h2>Judul Artikel 1</h2>
        <p>Ini adalah isi artikel biasa.</p>
    </div>

    <div class="kartu">
        <h2>Judul Artikel 2</h2>
        <p class="penting">Peringatan: Artikel ini berisi informasi penting!</p>
    </div>

</body>
</html></h1>
